name: Signaler un bug
description: Un comportement incorrect de l'application
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Que se passe-t-il ?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Aller sur …
        2. Cliquer sur …
        3. Constater …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environnement
      placeholder: Production / préproduction, navigateur, appareil
  - type: textarea
    id: notes
    attributes:
      label: Captures, journaux
      description: Ne jamais coller de RIB, de clé ou de données réelles d'un client.
