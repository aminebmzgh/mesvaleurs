name: CI

# Dépôt public : minutes Actions gratuites. Pas de run sur push develop
# (le code a déjà été testé par sa PR) ; lancement manuel possible (Actions → Run workflow).
on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: Lint, types, tests unitaires, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          # Valeurs factices : le build ne contacte pas Supabase
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder

  database:
    name: Migrations, RLS et isolation multi-tenant
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Démarrer Supabase en local (migrations + seed)
        # Jusqu'à 3 essais : le registre d'images limite parfois le débit (« toomanyrequests »)
        # et un premier démarrage raté peut laisser un port occupé.
        run: |
          for attempt in 1 2 3; do
            pnpm exec supabase start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor,mailpit && exit 0
            echo "::warning::supabase start a échoué (essai $attempt/3), nouvel essai…"
            pnpm exec supabase stop --no-backup || true
            sleep $((attempt * 30))
          done
          exit 1
      - name: Lint SQL
        run: pnpm db:lint
      - name: Tests pgTAP (RLS, rôles, isolation)
        run: pnpm db:test
      - name: Types TypeScript à jour avec le schéma
        run: |
          pnpm db:types
          git diff --exit-code src/types/database.ts || {
            echo "::error::src/types/database.ts n'est pas à jour : lancez pnpm db:types et commitez le résultat."
            exit 1
          }

  e2e:
    name: Tests de bout en bout (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Démarrer Supabase en local (migrations + seed)
        # Jusqu'à 3 essais : le registre d'images limite parfois le débit (« toomanyrequests »)
        # et un premier démarrage raté peut laisser un port occupé.
        run: |
          for attempt in 1 2 3; do
            pnpm exec supabase start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor,mailpit && exit 0
            echo "::warning::supabase start a échoué (essai $attempt/3), nouvel essai…"
            pnpm exec supabase stop --no-backup || true
            sleep $((attempt * 30))
          done
          exit 1
      - name: Variables d'environnement de la base locale
        run: |
          eval "$(pnpm exec supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=')"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: rapport-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7
